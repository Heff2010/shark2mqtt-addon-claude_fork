name: Claude Shark2MQTT
version: "1.0.8-claude.2"
slug: claude_shark2mqtt
description: >-
  Shark2MQTT with UR2850ZEUS fixes and a manual-login token option. Installs
  and can run beside the original Shark2MQTT app.
url: https://github.com/Heff2010/shark2mqtt-addon-claude_fork
arch:
  - amd64
  - aarch64
hassio_api: true
services:
  - mqtt:need
options:
  shark_token: ""
  browser_login: false
  shark_username: ""
  shark_password: ""
  shark_region: us
  shark_household_id: ""
  use_supervisor_mqtt_service: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_prefix: shark2mqtt
  run_side_by_side: true
  poll_interval: 300
  poll_interval_active: 20
  pause_operating_mode: "1"
  log_level: INFO
schema:
  shark_token: password?
  browser_login: bool
  shark_username: str?
  shark_password: password?
  shark_region: list(us|eu)
  shark_household_id: str?
  use_supervisor_mqtt_service: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_prefix: str
  run_side_by_side: bool
  poll_interval: int(10,3600)
  poll_interval_active: int(5,300)
  pause_operating_mode: list(1|0)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
